<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Seraph's logo, copied from docs/. Files in public/ are served at the site root. The browser tab uses the
         SVG (the .ico where SVG icons aren't supported), an iPhone's home screen the 180px PNG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Seraph</title>
    <script>
      // Dark is the default. Apply the saved theme ("light", "dark" or "system") and accent color before the
      // first paint, so the page doesn't flash dark and blue first. Both are picked in the sidebar's Settings.
      // Storage can be blocked (private window): then it just stays dark and blue.
      try {
        const theme = localStorage.getItem("theme");
        const systemLight = !window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "light" || (theme === "system" && systemLight)) {
          document.documentElement.classList.remove("dark");
        }
        document.documentElement.dataset.accent = localStorage.getItem("accent") || "blue";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
