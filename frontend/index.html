<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%226.5%22 cy=%226.5%22 r=%224.5%22 fill=%22none%22 stroke=%22%233b82f6%22 stroke-width=%222%22/%3E%3Cpath d=%22m10 10 4.5 4.5%22 stroke=%22%233b82f6%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <title>Searcher</title>
    <script>
      // Dark is the default. Apply a saved "light" before the first paint, so the page doesn't flash dark first.
      // Storage can be blocked (private window): then it just stays dark.
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
