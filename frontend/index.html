<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1.5 13.5 3.5V7.5C13.5 11 11 13.4 8 14.5 5 13.4 2.5 11 2.5 7.5V3.5Z%22 fill=%22none%22 stroke=%22%232ea043%22 stroke-width=%221.6%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M5.5 8 7.3 9.8 10.6 6.2%22 fill=%22none%22 stroke=%22%232ea043%22 stroke-width=%221.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" />
    <title>Seraph</title>
    <script>
      // Dark is the default. Apply the saved theme ("light", "dark" or "system") and accent color before the
      // first paint, so the page doesn't flash dark and blue first. Both are picked in the sidebar's Settings.
      // Storage can be blocked (private window): then it just stays dark and blue.
      try {
        const theme = localStorage.getItem("theme");
        const systemLight = !window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "light" || (theme === "system" && systemLight)) {
          document.documentElement.classList.remove("dark");
        }
        document.documentElement.dataset.accent = localStorage.getItem("accent") || "blue";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
