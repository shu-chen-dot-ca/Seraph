[project]
name = "github-searcher"
version = "0.1.0"
description = "Find GitHub repositories by describing what you want in plain English."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "fastapi>=0.143.1",
    "httpx>=0.28",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=15",
]

[project.scripts]
# `uv run serve` starts the backend from any directory.
serve = "backend.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_searcher", "sandbox", "backend"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
