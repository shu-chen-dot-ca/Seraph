<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 444" width="1280" height="444" role="img" aria-label="Seraph's left list in three parts. What waits for you: the Inbox with its Questions and Approvals tabs, and Notifications. Projects, private and open source: each project's board from Open to Done, one page per issue with its whole timeline, Find issues and Find projects, and the project's Agents and Settings. Team and machines: Team with each agent's chat, Machines with desktops and Images, and Settings." font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #faf9f7; }
    .lane { fill: #f2f0ec; stroke: #e3dfd8; }
    .box { fill: #ffffff; stroke: #d3cec6; }
    .key { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
    .t { fill: #1c1e24; }
    .m { fill: #6a6e77; }
    .accent { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1015; }
      .lane { fill: #151821; stroke: #232836; }
      .box { fill: #1b1f2a; stroke: #2f3546; }
      .key { fill: #1b1f2a; stroke: #4f8cff; }
      .t { fill: #e8eaef; }
      .m { fill: #9aa1ad; }
      .accent { fill: #4f8cff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="444" rx="18"/>

  <text class="t" x="40" y="46" font-size="20" font-weight="600">The app</text>
  <text class="m" x="1240" y="46" font-size="13" text-anchor="end">Go to finds anything by name or number. New starts any kind of work.</text>

  <!-- What waits for you -->
  <rect class="lane" x="40" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="64" y="108" font-size="17" font-weight="600">What waits for you</text>
  <text class="m" x="64" y="130" font-size="12">Answer first, then approve</text>

  <rect class="key" x="60" y="150" width="340" height="110" rx="9"/>
  <text class="accent" x="74" y="174" font-size="13" font-weight="600">Inbox</text>
  <text class="t" x="74" y="198" font-size="12">Questions: an agent asked; some go ahead on a timer</text>
  <text class="t" x="74" y="216" font-size="12">Approvals: send or merge, one by one or many at once</text>
  <text class="m" x="74" y="244" font-size="11.5">Plain words first; the diff and exact text under Details</text>

  <rect class="box" x="60" y="270" width="340" height="50" rx="9"/>
  <text class="t" x="74" y="291" font-size="13" font-weight="600">Notifications</text>
  <text class="m" x="74" y="308" font-size="11.5">from GitHub, each opening the issue it belongs to</text>

  <!-- Projects -->
  <rect class="lane" x="450" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="474" y="108" font-size="17" font-weight="600">Projects</text>
  <text class="m" x="474" y="130" font-size="12">Private (yours) and open source</text>

  <rect class="box" x="470" y="150" width="340" height="70" rx="9"/>
  <text class="t" x="484" y="173" font-size="13" font-weight="600">A project's board</text>
  <text class="t" x="484" y="194" font-size="12">Open · In progress · In review · Approval · Sent · Done</text>
  <text class="m" x="484" y="211" font-size="11.5">Assign an open issue to an agent</text>

  <rect class="box" x="470" y="230" width="340" height="50" rx="9"/>
  <text class="t" x="484" y="251" font-size="13" font-weight="600">An issue's page</text>
  <text class="m" x="484" y="268" font-size="11.5">its whole story on one timeline, with the proof</text>

  <rect class="box" x="470" y="290" width="161" height="50" rx="9"/>
  <text class="t" x="484" y="311" font-size="13" font-weight="600">Find</text>
  <text class="m" x="484" y="328" font-size="11.5">issues and projects</text>
  <rect class="box" x="649" y="290" width="161" height="50" rx="9"/>
  <text class="t" x="663" y="311" font-size="13" font-weight="600">Agents · Settings</text>
  <text class="m" x="663" y="328" font-size="11.5">of each project</text>

  <!-- Team and machines -->
  <rect class="lane" x="860" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="884" y="108" font-size="17" font-weight="600">Team and machines</text>
  <text class="m" x="884" y="130" font-size="12">The agents and where they work</text>

  <rect class="box" x="880" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="894" y="171" font-size="13" font-weight="600">Team</text>
  <text class="m" x="894" y="188" font-size="11.5">chats and jobs</text>
  <rect class="box" x="1059" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="1073" y="171" font-size="13" font-weight="600">Machines</text>
  <text class="m" x="1073" y="188" font-size="11.5">desktops and images</text>

  <rect class="box" x="880" y="210" width="340" height="50" rx="9"/>
  <text class="t" x="894" y="231" font-size="13" font-weight="600">Settings</text>
  <text class="m" x="894" y="248" font-size="11.5">GitHub account · when agents ask you · theme · updates</text>

  <text class="m" x="40" y="424" font-size="13">On a phone the left list is a row of tabs at the bottom.</text>
  <text class="m" x="1240" y="424" font-size="13" text-anchor="end">Pages update live; nothing needs a refresh.</text>
</svg>
