<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 444" width="1280" height="444" role="img" aria-label="Seraph's three header tabs and their pages. Home, for finding and fixing issues on open source: Explore, Repos, Tracked, Issues, Jobs, Agents, VMs, Resource. GitHub, for following and answering your GitHub work: Overview, Inbox, Notifications, Tasks, Pull requests, Issues, Your repositories, Account. Workspace, for your own projects and research: Home, Pull requests, Papers, Settings, and a repository's page with Agents, Code, Issues, Pull requests, Commits, Actions, Development and Releases." font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #faf9f7; }
    .lane { fill: #f2f0ec; stroke: #e3dfd8; }
    .box { fill: #ffffff; stroke: #d3cec6; }
    .key { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
    .t { fill: #1c1e24; }
    .m { fill: #6a6e77; }
    .accent { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e1015; }
      .lane { fill: #151821; stroke: #232836; }
      .box { fill: #1b1f2a; stroke: #2f3546; }
      .key { fill: #1b1f2a; stroke: #4f8cff; }
      .t { fill: #e8eaef; }
      .m { fill: #9aa1ad; }
      .accent { fill: #4f8cff; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="444" rx="18"/>

  <text class="t" x="40" y="46" font-size="20" font-weight="600">The app</text>
  <text class="m" x="1240" y="46" font-size="13" text-anchor="end">The same agents, VMs and Inbox behind all three tabs.</text>

  <!-- Home -->
  <rect class="lane" x="40" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="64" y="108" font-size="17" font-weight="600">Home</text>
  <text class="m" x="64" y="130" font-size="12">Find and fix issues on open source</text>

  <rect class="box" x="60" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="74" y="171" font-size="13" font-weight="600">Explore</text>
  <text class="m" x="74" y="188" font-size="11.5">finds new repos</text>
  <rect class="box" x="239" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="253" y="171" font-size="13" font-weight="600">Repos</text>
  <text class="m" x="253" y="188" font-size="11.5">recommended repos</text>

  <rect class="box" x="60" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="74" y="231" font-size="13" font-weight="600">Tracked</text>
  <text class="m" x="74" y="248" font-size="11.5">repos you watch</text>
  <rect class="box" x="239" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="253" y="231" font-size="13" font-weight="600">Issues</text>
  <text class="m" x="253" y="248" font-size="11.5">issues to assign</text>

  <rect class="box" x="60" y="270" width="161" height="50" rx="9"/>
  <text class="t" x="74" y="291" font-size="13" font-weight="600">Jobs</text>
  <text class="m" x="74" y="308" font-size="11.5">steps of every job</text>
  <rect class="box" x="239" y="270" width="161" height="50" rx="9"/>
  <text class="t" x="253" y="291" font-size="13" font-weight="600">Agents</text>
  <text class="m" x="253" y="308" font-size="11.5">chats and desktops</text>

  <rect class="box" x="60" y="330" width="161" height="50" rx="9"/>
  <text class="t" x="74" y="351" font-size="13" font-weight="600">VMs</text>
  <text class="m" x="74" y="368" font-size="11.5">desktops and images</text>
  <rect class="box" x="239" y="330" width="161" height="50" rx="9"/>
  <text class="t" x="253" y="351" font-size="13" font-weight="600">Resource</text>
  <text class="m" x="253" y="368" font-size="11.5">this computer</text>

  <!-- GitHub -->
  <rect class="lane" x="450" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="474" y="108" font-size="17" font-weight="600">GitHub</text>
  <text class="m" x="474" y="130" font-size="12">Follow and answer your GitHub work</text>

  <rect class="box" x="470" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="484" y="171" font-size="13" font-weight="600">Overview</text>
  <text class="m" x="484" y="188" font-size="11.5">at a glance</text>
  <rect class="key" x="649" y="150" width="161" height="50" rx="9"/>
  <text class="accent" x="663" y="171" font-size="13" font-weight="600">Inbox</text>
  <text class="m" x="663" y="188" font-size="11.5">drafts to approve</text>

  <rect class="box" x="470" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="484" y="231" font-size="13" font-weight="600">Notifications</text>
  <text class="m" x="484" y="248" font-size="11.5">from GitHub</text>
  <rect class="box" x="649" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="663" y="231" font-size="13" font-weight="600">Tasks</text>
  <text class="m" x="663" y="248" font-size="11.5">agent work by issue</text>

  <rect class="box" x="470" y="270" width="161" height="50" rx="9"/>
  <text class="t" x="484" y="291" font-size="13" font-weight="600">Pull requests</text>
  <text class="m" x="484" y="308" font-size="11.5">yours, full threads</text>
  <rect class="box" x="649" y="270" width="161" height="50" rx="9"/>
  <text class="t" x="663" y="291" font-size="13" font-weight="600">Issues</text>
  <text class="m" x="663" y="308" font-size="11.5">yours, full threads</text>

  <rect class="box" x="470" y="330" width="161" height="50" rx="9"/>
  <text class="t" x="484" y="351" font-size="13" font-weight="600">Your repositories</text>
  <text class="m" x="484" y="368" font-size="11.5">code · PRs · Actions</text>
  <rect class="box" x="649" y="330" width="161" height="50" rx="9"/>
  <text class="t" x="663" y="351" font-size="13" font-weight="600">Account</text>
  <text class="m" x="663" y="368" font-size="11.5">sign in with GitHub</text>

  <!-- Workspace -->
  <rect class="lane" x="860" y="76" width="380" height="316" rx="14"/>
  <text class="t" x="884" y="108" font-size="17" font-weight="600">Workspace</text>
  <text class="m" x="884" y="130" font-size="12">Your own projects and research</text>

  <rect class="box" x="880" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="894" y="171" font-size="13" font-weight="600">Home</text>
  <text class="m" x="894" y="188" font-size="11.5">your repositories</text>
  <rect class="box" x="1059" y="150" width="161" height="50" rx="9"/>
  <text class="t" x="1073" y="171" font-size="13" font-weight="600">Pull requests</text>
  <text class="m" x="1073" y="188" font-size="11.5">every PR you're in</text>

  <rect class="box" x="880" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="894" y="231" font-size="13" font-weight="600">Papers</text>
  <text class="m" x="894" y="248" font-size="11.5">reproduce a paper</text>
  <rect class="box" x="1059" y="210" width="161" height="50" rx="9"/>
  <text class="t" x="1073" y="231" font-size="13" font-weight="600">Settings</text>
  <text class="m" x="1073" y="248" font-size="11.5">theme · updates</text>

  <rect class="box" x="880" y="270" width="340" height="110" rx="9"/>
  <text class="t" x="894" y="294" font-size="13" font-weight="600">A repository's page</text>
  <text class="t" x="894" y="318" font-size="12">Agents · Code · Issues · Pull requests</text>
  <text class="t" x="894" y="336" font-size="12">Commits · Actions · Development · Releases</text>
  <text class="m" x="894" y="364" font-size="11.5">Development: agents work on it for you</text>

  <text class="m" x="40" y="424" font-size="13">Below 768 px wide, one Menu drawer holds all three tabs.</text>
  <text class="m" x="1240" y="424" font-size="13" text-anchor="end">Pages update live; nothing needs a refresh.</text>
</svg>
