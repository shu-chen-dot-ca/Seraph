<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="732" viewBox="0 0 1240 732" role="img" aria-label="Records: Repo, Issue and Tracked repo (lists with undo/redo), Agent, Job, Draft, VM and Image. One agent has many jobs; a job has one agent and is for at most one issue. A job has many drafts. An agent has a target VM; a VM has a holder and a queue of agents. A VM is made from an image.">
<title>Data model</title>
<desc>Records: Repo, Issue and Tracked repo (lists with undo/redo), Agent, Job, Draft, VM and Image. One agent has many jobs; a job has one agent and is for at most one issue. A job has many drafts. An agent has a target VM; a VM has a holder and a queue of agents. A VM is made from an image.</desc>
