<text x="722.78" y="563" class="pt l-you" text-anchor="middle" style="font-size:10.5px">never deleted</text>
<text x="476" y="608" class="m" text-anchor="start">kind: pr, comment, question</text>
<text x="476" y="626" class="m" text-anchor="start">body: what GitHub would get</text>
<text x="476" y="644" class="m" text-anchor="start">overview: plain words, for you</text>
<text x="476" y="662" class="m" text-anchor="start">diff + a copy of the evidence</text>
<text x="476" y="680" class="m" text-anchor="start">status: pending → approved,</text>
<text x="476" y="698" class="m" text-anchor="start">  rejected or replied</text>
