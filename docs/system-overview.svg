<rect class="bg" x="0.5" y="0.5" width="1279" height="823" rx="14"/>
<text x="24" y="42" class="title" text-anchor="start">System overview</text>
<text x="24" y="66" class="sub" text-anchor="start">One machine runs everything. Agents think in Claude Code; every tool they call runs in the backend, which reads GitHub and drives the VMs through Incus.</text>
