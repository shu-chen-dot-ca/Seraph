<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="824" viewBox="0 0 1280 824" role="img" aria-label="The browser talks to a FastAPI backend over HTTP and one live websocket, and opens VM desktops directly. The backend runs the stores, the agents manager, the MCP tools and the sandbox managers. Each agent is a Claude Code process with no host tools; it calls the backend&#x27;s tools. GitHub is only read; VMs are driven through Incus.">
<title>System overview</title>
<desc>The browser talks to a FastAPI backend over HTTP and one live websocket, and opens VM desktops directly. The backend runs the stores, the agents manager, the MCP tools and the sandbox managers. Each agent is a Claude Code process with no host tools; it calls the backend&#x27;s tools. GitHub is only read; VMs are driven through Incus.</desc>
