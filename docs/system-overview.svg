<text x="1000" y="356" class="h" text-anchor="start">Claude Code CLI</text>
<text x="1000" y="376" class="s" text-anchor="start">one per agent, via Agent SDK</text>
<text x="1000" y="394" class="m" text-anchor="start">claude-opus-5-5[1m]</text>
<text x="1000" y="412" class="s" text-anchor="start">compacts at 500k tokens</text>
<text x="1000" y="430" class="s" text-anchor="start">built-in: TodoWrite only</text>
<text x="1000" y="448" class="s" text-anchor="start">no host shell, files, web</text>
<text x="960" y="556" class="s" text-anchor="start">resumed by session id</text>
<text x="960" y="574" class="s" text-anchor="start">after a backend restart</text>
