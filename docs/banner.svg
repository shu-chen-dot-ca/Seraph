<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="GitHub Searcher: agents find good first issues and fix them in sandbox VMs, with evidence. You decide what reaches GitHub.">
<title>GitHub Searcher</title>
<desc>GitHub Searcher: agents find good first issues and fix them in sandbox VMs, with evidence. You decide what reaches GitHub.</desc>
