<defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-edge" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-you" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-ok" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-no" d="M0,0.5 L10,5 L0,9.5 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1279" height="259" rx="14"/>
<circle cx="86" cy="104" r="30" fill="none" class="x-ok" stroke-width="7"/>
<path d="M108,126 L132,150" class="x-ok" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M73,104 L83,114 L100,94" class="x-ok" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="160" y="112" class="title" text-anchor="start" style="font-size:42px;letter-spacing:-0.01em">GitHub Searcher</text>
<text x="162" y="150" class="sub" text-anchor="start" style="font-size:17px">Agents find good first issues, fix them in VMs and prove it.</text>
<text x="162" y="176" class="sub" text-anchor="start" style="font-size:17px">Nothing reaches GitHub until you send it yourself.</text>
<line class="e-edge" x1="40" y1="212" x2="640" y2="212" stroke-width="0.8" opacity="0.35"/>
<text x="40" y="238" class="m" text-anchor="start">Claude agents · Incus VMs · FastAPI · React</text>
<rect class="card-shadow" x="700" y="84" width="160" height="96" rx="9"/>
<rect class="c-claude" x="700" y="82" width="160" height="96" rx="9" stroke-width="1.3"/>
<text x="716" y="106" class="h l-claude" text-anchor="start">1  Find</text>
<text x="716" y="126" class="s" text-anchor="start">agents search GitHub</text>
<text x="716" y="144" class="s" text-anchor="start">and judge maintainers</text>
<rect class="card-shadow" x="890" y="84" width="160" height="96" rx="9"/>
<rect class="c-vm" x="890" y="82" width="160" height="96" rx="9" stroke-width="1.3"/>
<text x="906" y="106" class="h l-vm" text-anchor="start">2  Fix</text>
<text x="906" y="126" class="s" text-anchor="start">in a sandbox VM, tests</text>
<text x="906" y="144" class="s" text-anchor="start">pass before and after</text>
<rect class="card-shadow" x="1080" y="84" width="160" height="96" rx="9"/>
<rect class="c-you" x="1080" y="82" width="160" height="96" rx="9" stroke-width="1.3"/>
<text x="1096" y="106" class="h l-you" text-anchor="start">3  Decide</text>
<text x="1096" y="126" class="s" text-anchor="start">drafts wait in your</text>
<text x="1096" y="144" class="s" text-anchor="start">Inbox; you send them</text>
<path class="line e-edge" d="M860,130 L890,130" marker-end="url(#ah-edge)"/>
<path class="line e-edge" d="M1050,130 L1080,130" marker-end="url(#ah-edge)"/>
<rect class="p-you" x="1090.4" y="196" width="139.2" height="20" rx="10" stroke-width="1.1"/>
<text x="1160" y="210" class="pt l-you" text-anchor="middle">you approve every PR</text>
</svg>
