<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="State diagram of one agent and one VM: no VM, waiting in line, holding. queue_for_vm joins the line or takes a free VM; when the holder releases, the first in line gets it. You can take a VM over, give it to a waiting agent, move one to the front, or remove one, which interrupts it and kills what it runs in the VM.">
<title>Who holds a VM</title>
<desc>State diagram of one agent and one VM: no VM, waiting in line, holding. queue_for_vm joins the line or takes a free VM; when the holder releases, the first in line gets it. You can take a VM over, give it to a waiting agent, move one to the front, or remove one, which interrupts it and kills what it runs in the VM.</desc>
