  .z-browser{fill:#eef5ff;stroke:#a8c8f8} .c-browser{fill:#ffffff;stroke:#a8c8f8} .h-browser{fill:#eef5ff} .l-browser{fill:#0b5cd5} .p-browser{fill:#eef5ff;stroke:#a8c8f8} .z-host{fill:#f6f8fa;stroke:#d0d7de} .c-host{fill:#ffffff;stroke:#d0d7de} .h-host{fill:#f6f8fa} .l-host{fill:#424a53} .p-host{fill:#f6f8fa;stroke:#d0d7de} .z-core{fill:#ffffff;stroke:#c9d1d9} .c-core{fill:#ffffff;stroke:#c9d1d9} .h-core{fill:#ffffff} .l-core{fill:#424a53} .p-core{fill:#ffffff;stroke:#c9d1d9} .z-claude{fill:#f6f2ff;stroke:#cbb8fb} .c-claude{fill:#ffffff;stroke:#cbb8fb} .h-claude{fill:#f6f2ff} .l-claude{fill:#6e40c9} .p-claude{fill:#f6f2ff;stroke:#cbb8fb} .z-vm{fill:#eefaf2;stroke:#94d6a9} .c-vm{fill:#ffffff;stroke:#94d6a9} .h-vm{fill:#eefaf2} .l-vm{fill:#1a7f37} .p-vm{fill:#eefaf2;stroke:#94d6a9} .z-ext{fill:#fff6ec;stroke:#f2c08a} .c-ext{fill:#ffffff;stroke:#f2c08a} .h-ext{fill:#fff6ec} .l-ext{fill:#bc4c00} .p-ext{fill:#fff6ec;stroke:#f2c08a} .z-you{fill:#fff8e0;stroke:#ecc548} .c-you{fill:#ffffff;stroke:#ecc548} .h-you{fill:#fff8e0} .l-you{fill:#9a6700} .p-you{fill:#fff8e0;stroke:#ecc548} .z-muted{fill:#f6f8fa;stroke:#d0d7de} .c-muted{fill:#ffffff;stroke:#d0d7de} .h-muted{fill:#f6f8fa} .l-muted{fill:#6e7781} .p-muted{fill:#f6f8fa;stroke:#d0d7de} .e-edge{stroke:#6e7781} .a-edge{fill:#6e7781} .x-edge{stroke:#6e7781} .e-you{stroke:#bf8700} .a-you{fill:#bf8700} .x-you{stroke:#bf8700} .e-ok{stroke:#1a7f37} .a-ok{fill:#1a7f37} .x-ok{stroke:#1a7f37} .e-no{stroke:#cf222e} .a-no{fill:#cf222e} .x-no{stroke:#cf222e}
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .bg { fill: #0d1117; stroke: #30363d; }
    .sub, .s { fill: #9198a1; }
    .m { fill: #c9d1d9; }
    .el { fill: #c9d1d9; stroke: #0d1117; }
    .pt { fill: #e6edf3; }
    .halo { fill: #0d1117; }
    .card-shadow { opacity: 0; }
    .z-browser{fill:#0b1a2e;stroke:#22477a} .c-browser{fill:#151b23;stroke:#22477a} .h-browser{fill:#0b1a2e} .l-browser{fill:#79b8ff} .p-browser{fill:#0b1a2e;stroke:#22477a} .z-host{fill:#10151c;stroke:#30363d} .c-host{fill:#151b23;stroke:#30363d} .h-host{fill:#10151c} .l-host{fill:#b1bac4} .p-host{fill:#10151c;stroke:#30363d} .z-core{fill:#0d1117;stroke:#3d444d} .c-core{fill:#151b23;stroke:#3d444d} .h-core{fill:#0d1117} .l-core{fill:#b1bac4} .p-core{fill:#0d1117;stroke:#3d444d} .z-claude{fill:#18122b;stroke:#45367d} .c-claude{fill:#151b23;stroke:#45367d} .h-claude{fill:#18122b} .l-claude{fill:#b392f0} .p-claude{fill:#18122b;stroke:#45367d} .z-vm{fill:#0c1f15;stroke:#22603a} .c-vm{fill:#151b23;stroke:#22603a} .h-vm{fill:#0c1f15} .l-vm{fill:#56d364} .p-vm{fill:#0c1f15;stroke:#22603a} .z-ext{fill:#231509;stroke:#6e3d10} .c-ext{fill:#151b23;stroke:#6e3d10} .h-ext{fill:#231509} .l-ext{fill:#ffa657} .p-ext{fill:#231509;stroke:#6e3d10} .z-you{fill:#241c08;stroke:#6e5512} .c-you{fill:#151b23;stroke:#6e5512} .h-you{fill:#241c08} .l-you{fill:#e3b341} .p-you{fill:#241c08;stroke:#6e5512} .z-muted{fill:#151b23;stroke:#30363d} .c-muted{fill:#151b23;stroke:#30363d} .h-muted{fill:#151b23} .l-muted{fill:#8b949e} .p-muted{fill:#151b23;stroke:#30363d} .e-edge{stroke:#8b949e} .a-edge{fill:#8b949e} .x-edge{stroke:#8b949e} .e-you{stroke:#e3b341} .a-you{fill:#e3b341} .x-you{stroke:#e3b341} .e-ok{stroke:#3fb950} .a-ok{fill:#3fb950} .x-ok{stroke:#3fb950} .e-no{stroke:#f85149} .a-no{fill:#f85149} .x-no{stroke:#f85149}
  }
</style>
<defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-edge" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-you" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-ok" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-no" d="M0,0.5 L10,5 L0,9.5 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1199" height="639" rx="14"/>
<text x="24" y="42" class="title" text-anchor="start">Who holds a VM</text>
<text x="24" y="66" class="sub" text-anchor="start">Each VM has one holder and a line of waiting agents. An agent works in a VM only while it holds it, and never holds one it has nothing to do in.</text>
<rect class="card-shadow" x="60" y="222" width="240" height="80" rx="9"/>
<rect class="c-muted" x="60" y="220" width="240" height="80" rx="9" stroke-width="1.3"/>
<text x="76" y="244" class="h" text-anchor="start">No VM</text>
<text x="76" y="264" class="s" text-anchor="start">idle, or doing GitHub-only</text>
<text x="76" y="282" class="s" text-anchor="start">work like finding issues</text>
<rect class="card-shadow" x="480" y="222" width="240" height="80" rx="9"/>
<rect class="c-claude" x="480" y="220" width="240" height="80" rx="9" stroke-width="1.3"/>
<text x="496" y="244" class="h" text-anchor="start">Waiting in line</text>
<text x="496" y="264" class="s" text-anchor="start">number 1, 2, … in the queue</text>
<text x="496" y="282" class="s" text-anchor="start">stays in line while VM is off</text>
<rect class="card-shadow" x="900" y="222" width="240" height="80" rx="9"/>
<rect class="c-vm" x="900" y="220" width="240" height="80" rx="9" stroke-width="1.3"/>
<text x="916" y="244" class="h" text-anchor="start">Holding the VM</text>
<text x="916" y="264" class="s" text-anchor="start">VM tools work for it</text>
<text x="916" y="282" class="s" text-anchor="start">does all its jobs for that VM</text>
<path class="line e-edge" d="M160,220 L160.0,129.0 Q160,120 169.0,120.0 L1011.0,120.0 Q1020,120 1020.0,129.0 L1020,220" marker-end="url(#ah-edge)"/>
<text x="480" y="112" class="el" text-anchor="middle">queue_for_vm: free and nobody waiting</text>
<path class="line e-edge" d="M220,220 L220.0,179.0 Q220,170 229.0,170.0 L551.0,170.0 Q560,170 560.0,179.0 L560,220" marker-end="url(#ah-edge)"/>
<text x="390" y="162" class="el" text-anchor="middle">queue_for_vm: someone holds it</text>
<path class="line e-edge" d="M660,220 L660.0,179.0 Q660,170 669.0,170.0 L951.0,170.0 Q960,170 960.0,179.0 L960,220" marker-end="url(#ah-edge)"/>
<text x="810" y="162" class="el" text-anchor="middle">holder releases: first in line gets it, woken</text>
<path class="line e-you dash" d="M960,300 L960.0,331.0 Q960,340 951.0,340.0 L689.0,340.0 Q680,340 680.0,331.0 L680,300" marker-end="url(#ah-you)"/>
<text x="820" y="358" class="el" text-anchor="middle">Take over: you hold it, it goes to the front</text>
<path class="line e-you dash" d="M720,262 L900,262" marker-end="url(#ah-you)"/>
<text x="810" y="254" class="el" text-anchor="middle">Give</text>
<path class="line e-you dash" d="M520,300 L520.0,327.0 Q520,336 529.0,336.0 L591.0,336.0 Q600,336 600.0,327.0 L600,300" marker-end="url(#ah-you)"/>
<text x="560" y="354" class="el" text-anchor="middle">Move to front</text>
<path class="line e-edge" d="M1040,300 L1040.0,383.0 Q1040,392 1031.0,392.0 L169.0,392.0 Q160,392 160.0,383.0 L160,300" marker-end="url(#ah-edge)"/>
<text x="600" y="410" class="el" text-anchor="middle">release_vm, or released for it when no open jobs remain</text>
<path class="line e-you dash" d="M1080,300 L1080.0,439.0 Q1080,448 1071.0,448.0 L119.0,448.0 Q110,448 110.0,439.0 L110,300" marker-end="url(#ah-you)"/>
<text x="600" y="466" class="el" text-anchor="middle">Remove (from holding or the line): it is interrupted, and what it still runs in the VM is killed</text>
<path class="line e-you dash" d="M480,262 L300,262" marker-end="url(#ah-you)"/>
<text x="390" y="254" class="el" text-anchor="middle">Remove</text>
<line class="e-edge" x1="24" y1="500" x2="1176" y2="500" stroke-width="0.8" opacity="0.4"/>
<text x="40" y="528" class="zl l-vm" text-anchor="start">EXAMPLE · vm1</text>
<rect class="card-shadow" x="40" y="546" width="150" height="60" rx="9"/>
<rect class="c-vm" x="40" y="544" width="150" height="60" rx="9" stroke-width="1.3"/>
<text x="56" y="568" class="h" text-anchor="start">holder</text>
<text x="56" y="588" class="m" text-anchor="start">agent-1</text>
<rect class="card-shadow" x="214" y="546" width="130" height="60" rx="9"/>
<rect class="c-claude" x="214" y="544" width="130" height="60" rx="9" stroke-width="1.3"/>
<text x="230" y="568" class="h" text-anchor="start">1st in line</text>
<text x="230" y="588" class="m" text-anchor="start">agent-2</text>
<rect class="card-shadow" x="368" y="546" width="130" height="60" rx="9"/>
<rect class="c-claude" x="368" y="544" width="130" height="60" rx="9" stroke-width="1.3"/>
<text x="384" y="568" class="h" text-anchor="start">2nd in line</text>
<text x="384" y="588" class="m" text-anchor="start">agent-3</text>
<path class="line e-edge" d="M214,574 L190,574" marker-end="url(#ah-edge)"/>
<path class="line e-edge" d="M368,574 L344,574" marker-end="url(#ah-edge)"/>
<text x="560" y="528" class="zl l-host" text-anchor="start">RULES</text>
<text x="560" y="552" class="s" text-anchor="start">An agent is in at most one VM&#x27;s line at a time, and keeps its place while the VM is off.</text>
<text x="560" y="572" class="s" text-anchor="start">Given a VM with no open jobs left for it, an agent passes it on at once.</text>
<text x="560" y="592" class="s" text-anchor="start">Holding with open jobs but making no progress: two reminders, then the VM is released for it.</text>
<text x="1176" y="624" class="s" text-anchor="start"></text>
<line class="line e-edge" x1="780" y1="94" x2="816" y2="94" marker-end="url(#ah-edge)"/>
<text x="824" y="98" class="s" text-anchor="start">the agent or the app</text>
<line class="line e-you dash" x1="976" y1="94" x2="1012" y2="94" marker-end="url(#ah-you)"/>
<text x="1020" y="98" class="s" text-anchor="start">you, on the VM page</text>
</svg>
