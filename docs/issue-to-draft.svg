  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .bg { fill: #0d1117; stroke: #30363d; }
    .sub, .s { fill: #9198a1; }
    .m { fill: #c9d1d9; }
    .el { fill: #c9d1d9; stroke: #0d1117; }
    .pt { fill: #e6edf3; }
    .halo { fill: #0d1117; }
    .card-shadow { opacity: 0; }
    .z-browser{fill:#0b1a2e;stroke:#22477a} .c-browser{fill:#151b23;stroke:#22477a} .h-browser{fill:#0b1a2e} .l-browser{fill:#79b8ff} .p-browser{fill:#0b1a2e;stroke:#22477a} .z-host{fill:#10151c;stroke:#30363d} .c-host{fill:#151b23;stroke:#30363d} .h-host{fill:#10151c} .l-host{fill:#b1bac4} .p-host{fill:#10151c;stroke:#30363d} .z-core{fill:#0d1117;stroke:#3d444d} .c-core{fill:#151b23;stroke:#3d444d} .h-core{fill:#0d1117} .l-core{fill:#b1bac4} .p-core{fill:#0d1117;stroke:#3d444d} .z-claude{fill:#18122b;stroke:#45367d} .c-claude{fill:#151b23;stroke:#45367d} .h-claude{fill:#18122b} .l-claude{fill:#b392f0} .p-claude{fill:#18122b;stroke:#45367d} .z-vm{fill:#0c1f15;stroke:#22603a} .c-vm{fill:#151b23;stroke:#22603a} .h-vm{fill:#0c1f15} .l-vm{fill:#56d364} .p-vm{fill:#0c1f15;stroke:#22603a} .z-ext{fill:#231509;stroke:#6e3d10} .c-ext{fill:#151b23;stroke:#6e3d10} .h-ext{fill:#231509} .l-ext{fill:#ffa657} .p-ext{fill:#231509;stroke:#6e3d10} .z-you{fill:#241c08;stroke:#6e5512} .c-you{fill:#151b23;stroke:#6e5512} .h-you{fill:#241c08} .l-you{fill:#e3b341} .p-you{fill:#241c08;stroke:#6e5512} .z-muted{fill:#151b23;stroke:#30363d} .c-muted{fill:#151b23;stroke:#30363d} .h-muted{fill:#151b23} .l-muted{fill:#8b949e} .p-muted{fill:#151b23;stroke:#30363d} .e-edge{stroke:#8b949e} .a-edge{fill:#8b949e} .x-edge{stroke:#8b949e} .e-you{stroke:#e3b341} .a-you{fill:#e3b341} .x-you{stroke:#e3b341} .e-ok{stroke:#3fb950} .a-ok{fill:#3fb950} .x-ok{stroke:#3fb950} .e-no{stroke:#f85149} .a-no{fill:#f85149} .x-no{stroke:#f85149}
  }
</style>
<defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-edge" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-you" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-you" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-ok" d="M0,0.5 L10,5 L0,9.5 z"/></marker><marker id="ah-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a-no" d="M0,0.5 L10,5 L0,9.5 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1399" height="715" rx="14"/>
<text x="24" y="42" class="title" text-anchor="start">From good first issue to draft PR</text>
<text x="24" y="66" class="sub" text-anchor="start">Agents do the legwork, you make every decision, and nothing reaches GitHub until you send it yourself. Pills show the job&#x27;s status at each hand-off.</text>
<clipPath id="lanes"><rect x="24" y="92" width="1352" height="600" rx="12"/></clipPath><g clip-path="url(#lanes)">
<rect class="z-you" x="24" y="92" width="1352" height="144" stroke-width="1.2"/>
<text x="40" y="120" class="zl l-you" text-anchor="start">YOU</text>
<text x="40" y="138" class="s" text-anchor="start">in the app</text>
<rect class="z-claude" x="24" y="236" width="1352" height="160" stroke-width="1.2"/>
<text x="40" y="264" class="zl l-claude" text-anchor="start">AGENTS</text>
<text x="40" y="282" class="s" text-anchor="start">on the host</text>
<rect class="z-vm" x="24" y="396" width="1352" height="176" stroke-width="1.2"/>
<text x="40" y="424" class="zl l-vm" text-anchor="start">VM</text>
<text x="40" y="442" class="s" text-anchor="start">the one it holds</text>
<rect class="z-ext" x="24" y="572" width="1352" height="120" stroke-width="1.2"/>
<text x="40" y="600" class="zl l-ext" text-anchor="start">GITHUB</text>
<text x="40" y="618" class="s" text-anchor="start">read only</text>
</g>
<rect class="card-shadow" x="184" y="264" width="196" height="112" rx="9"/>
<rect class="c-claude" x="184" y="262" width="196" height="112" rx="9" stroke-width="1.3"/>
<text x="200" y="286" class="h" text-anchor="start">Find issues</text>
<text x="200" y="306" class="s" text-anchor="start">search GitHub, read threads,</text>
<text x="200" y="324" class="s" text-anchor="start">check maintainers answer</text>
<text x="200" y="342" class="s" text-anchor="start">outside PRs</text>
<text x="200" y="360" class="m" text-anchor="start">→ Issues list + note</text>
<rect class="card-shadow" x="412" y="118" width="180" height="100" rx="9"/>
<rect class="c-you" x="412" y="116" width="180" height="100" rx="9" stroke-width="1.3"/>
<text x="428" y="140" class="h" text-anchor="start">Assign</text>
<text x="428" y="160" class="s" text-anchor="start">pick an issue, an agent</text>
<text x="428" y="178" class="s" text-anchor="start">and its target VM</text>
<text x="428" y="196" class="m" text-anchor="start">→ new job (JSON)</text>
<rect class="card-shadow" x="628" y="264" width="180" height="92" rx="9"/>
<rect class="c-claude" x="628" y="262" width="180" height="92" rx="9" stroke-width="1.3"/>
<text x="644" y="286" class="hm" text-anchor="start">queue_for_vm</text>
<text x="644" y="306" class="s" text-anchor="start">waits its turn in line,</text>
<text x="644" y="324" class="s" text-anchor="start">even while the VM is off</text>
<rect class="card-shadow" x="816" y="418" width="280" height="146" rx="9"/>
<rect class="c-vm" x="816" y="416" width="280" height="146" rx="9" stroke-width="1.3"/>
<text x="832" y="440" class="h" text-anchor="start">Works in the VM it holds</text>
<text x="832" y="460" class="m" text-anchor="start">1  set up: clone, install</text>
<text x="832" y="478" class="m" text-anchor="start">2  reproduce the problem</text>
<text x="832" y="496" class="m" text-anchor="start">3  run_tests before: must pass</text>
<text x="832" y="514" class="m" text-anchor="start">4  fix with the smallest change</text>
<text x="832" y="532" class="m" text-anchor="start">5  evidence: before and after</text>
<text x="832" y="550" class="m" text-anchor="start">6  run_tests after: same command</text>
<rect class="card-shadow" x="1136" y="264" width="192" height="112" rx="9"/>
<rect class="c-claude" x="1136" y="262" width="192" height="112" rx="9" stroke-width="1.3"/>
<text x="1152" y="286" class="hm" text-anchor="start">draft_pr</text>
<text x="1152" y="306" class="s" text-anchor="start">diff read from the VM</text>
<text x="1152" y="324" class="s" text-anchor="start">+ evidence + overview</text>
<text x="1152" y="342" class="s" text-anchor="start">refused without before,</text>
<text x="1152" y="360" class="s" text-anchor="start">after and passing tests</text>
<rect class="card-shadow" x="1136" y="114" width="192" height="108" rx="9"/>
<rect class="c-you" x="1136" y="112" width="192" height="108" rx="9" stroke-width="1.3"/>
<text x="1152" y="136" class="h" text-anchor="start">Inbox</text>
<text x="1152" y="156" class="s" text-anchor="start">read the overview, evidence</text>
<text x="1152" y="174" class="s" text-anchor="start">and diff, then decide</text>
<rect class="p-you" x="1152.0" y="186" width="44.8" height="20" rx="10" stroke-width="1.1"/>
<text x="1174.4" y="200" class="pt l-you" text-anchor="middle">Reply</text>
<rect class="p-muted" x="1202.8" y="186" width="51.0" height="20" rx="10" stroke-width="1.1"/>
<text x="1228.28" y="200" class="pt l-muted" text-anchor="middle">Reject</text>
<rect class="p-vm" x="1259.8" y="186" width="57.1" height="20" rx="10" stroke-width="1.1"/>
<text x="1288.32" y="200" class="pt l-vm" text-anchor="middle">Approve</text>
<rect class="card-shadow" x="184" y="598" width="196" height="72" rx="9"/>
<rect class="c-ext" x="184" y="596" width="196" height="72" rx="9" stroke-width="1.3"/>
<text x="200" y="620" class="h" text-anchor="start">GitHub</text>
<text x="200" y="640" class="s" text-anchor="start">issues, PRs, code,</text>
<text x="200" y="658" class="s" text-anchor="start">how maintainers review</text>
<rect class="card-shadow" x="1136" y="598" width="192" height="72" rx="9"/>
<rect class="c-ext" x="1136" y="596" width="192" height="72" rx="9" stroke-width="1.3"/>
<text x="1152" y="620" class="h" text-anchor="start">You open the PR</text>
<text x="1152" y="640" class="s" text-anchor="start">on GitHub, yourself.</text>
<text x="1152" y="658" class="s" text-anchor="start">The app never posts.</text>
<path class="line e-edge" d="M282,596 L282,374" marker-end="url(#ah-edge)"/>
<text x="290" y="488" class="el" text-anchor="start">reads</text>
<path class="line e-edge" d="M282,262 L282.0,175.0 Q282,166 291.0,166.0 L412,166" marker-end="url(#ah-edge)"/>
<text x="347" y="158" class="el" text-anchor="middle">Issues list</text>
<path class="line e-edge" d="M592,166 L679.0,166.0 Q688,166 688.0,175.0 L688,262" marker-end="url(#ah-edge)"/>
<rect class="p-claude" x="613.5" y="156" width="53.0" height="20" rx="10" stroke-width="1.1"/>
<text x="640" y="170" class="pt l-claude" text-anchor="middle">queued</text>
<path class="line e-edge" d="M718,354 L718.0,475.0 Q718,484 727.0,484.0 L816,484" marker-end="url(#ah-edge)"/>
<text x="726" y="430" class="el" text-anchor="start">VM granted</text>
<rect class="p-vm" x="737.4" y="474" width="59.1" height="20" rx="10" stroke-width="1.1"/>
<text x="767" y="488" class="pt l-vm" text-anchor="middle">working</text>
<path class="line e-edge" d="M1096,484 L1223.0,484.0 Q1232,484 1232.0,475.0 L1232,374" marker-end="url(#ah-edge)"/>
<text x="1164" y="476" class="el" text-anchor="middle">diff + evidence</text>
<path class="line e-edge" d="M1232,262 L1232,220" marker-end="url(#ah-edge)"/>
<rect class="p-you" x="1177.8" y="231" width="108.4" height="20" rx="10" stroke-width="1.1"/>
<text x="1232" y="245" class="pt l-you" text-anchor="middle">waiting_on_user</text>
<path class="line e-you" d="M1136,196 L757.0,196.0 Q748,196 748.0,205.0 L748,262" marker-end="url(#ah-you)"/>
<text x="942" y="188" class="el" text-anchor="middle">Reply: it applies your feedback</text>
<rect class="p-claude" x="721.5" y="226" width="53.0" height="20" rx="10" stroke-width="1.1"/>
<text x="748" y="240" class="pt l-claude" text-anchor="middle">queued</text>
<path class="line e-you" d="M1328,196 L1347.0,196.0 Q1356,196 1356.0,205.0 L1356.0,623.0 Q1356,632 1347.0,632.0 L1328,632" marker-end="url(#ah-you)"/>
<rect class="p-vm" x="1335.7" y="326" width="40.6" height="20" rx="10" stroke-width="1.1"/>
<text x="1356" y="340" class="pt l-vm" text-anchor="middle">done</text>
<text x="1112" y="524" class="s" text-anchor="start">VM released when</text>
<text x="1112" y="542" class="s" text-anchor="start">no open jobs remain</text>
</svg>
