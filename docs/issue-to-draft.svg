<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="716" viewBox="0 0 1400 716" role="img" aria-label="Swimlane flow. An agent finds issues on GitHub and lists them. You assign one, which makes a queued job. The agent queues for its VM, works there (set up, reproduce, tests before, fix, evidence, tests after), then drafts a PR, and the job waits on you in the Inbox. Reply sends it back to work; approve marks it done and you open the PR on GitHub yourself.">
<title>From good first issue to draft PR</title>
<desc>Swimlane flow. An agent finds issues on GitHub and lists them. You assign one, which makes a queued job. The agent queues for its VM, works there (set up, reproduce, tests before, fix, evidence, tests after), then drafts a PR, and the job waits on you in the Inbox. Reply sends it back to work; approve marks it done and you open the PR on GitHub yourself.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { font-size: 21px; font-weight: 700; }
  .sub { font-size: 13px; fill: #59636e; }
  .zl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; }
  .h { font-size: 14px; font-weight: 650; }
  .s { font-size: 12px; fill: #59636e; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #31373d; }
  .hm { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; font-weight: 650; }
  .el { font-size: 11.5px; fill: #31373d; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
  .pt { font-size: 11px; font-weight: 600; fill: #31373d; }
