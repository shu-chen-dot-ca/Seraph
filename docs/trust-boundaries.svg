<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="744" viewBox="0 0 1280 744" role="img" aria-label="Trust boundaries. The backend loads the GitHub and Claude tokens from .env and only reads GitHub. Claude Code has no host shell, file or web tools. Agent commands reach a VM only through incus exec, for the agent holding it. Tokens never enter a VM; a VM reaches the internet but not this machine or the LAN; the API only answers localhost pages, so a VM&#x27;s desktop page gets 403.">
<title>What stays where</title>
<desc>Trust boundaries. The backend loads the GitHub and Claude tokens from .env and only reads GitHub. Claude Code has no host shell, file or web tools. Agent commands reach a VM only through incus exec, for the agent holding it. Tokens never enter a VM; a VM reaches the internet but not this machine or the LAN; the API only answers localhost pages, so a VM&#x27;s desktop page gets 403.</desc>
