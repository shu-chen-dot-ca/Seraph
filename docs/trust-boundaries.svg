<text x="964" y="396" class="h" text-anchor="start">Desktop and shell</text>
<text x="964" y="416" class="s" text-anchor="start">the agent&#x27;s work happens here</text>
<text x="964" y="434" class="s" text-anchor="start">runs as the desktop user</text>
<text x="964" y="452" class="s" text-anchor="start">commands tagged, killable</text>
<rect class="card-shadow" x="948" y="558" width="284" height="104" rx="9"/>
<rect class="c-you" x="948" y="556" width="284" height="104" rx="9" stroke-width="1.3"/>
<text x="964" y="580" class="h" text-anchor="start">Your VM secrets</text>
<text x="964" y="600" class="m" text-anchor="start">OPENAI_API_KEY=••••••</text>
<text x="964" y="618" class="s" text-anchor="start">the agent sees names only;</text>
<text x="964" y="636" class="s" text-anchor="start">values show as [hidden]</text>
