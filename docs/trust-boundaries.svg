<text x="656" y="260" class="h" text-anchor="start">Host shell, files</text>
<text x="656" y="280" class="s" text-anchor="start">your code, .env, home</text>
<rect class="card-shadow" x="312" y="374" width="248" height="104" rx="9"/>
<rect class="c-core" x="312" y="372" width="248" height="104" rx="9" stroke-width="1.3"/>
<text x="328" y="396" class="h" text-anchor="start">Backend process</text>
<text x="328" y="416" class="s" text-anchor="start">reads GitHub with the tokens</text>
<text x="328" y="434" class="s" text-anchor="start">runs every agent tool</text>
<text x="328" y="452" class="s" text-anchor="start">answers localhost pages only</text>
<rect class="card-shadow" x="640" y="374" width="236" height="104" rx="9"/>
<rect class="c-claude" x="640" y="372" width="236" height="104" rx="9" stroke-width="1.3"/>
<text x="656" y="396" class="h" text-anchor="start">Claude Code</text>
<text x="656" y="416" class="s" text-anchor="start">one process per agent</text>
<text x="656" y="434" class="s" text-anchor="start">built-in: TodoWrite only</text>
<text x="656" y="452" class="s" text-anchor="start">every other tool: backend</text>
<rect class="card-shadow" x="312" y="558" width="248" height="80" rx="9"/>
<rect class="c-you" x="312" y="556" width="248" height="80" rx="9" stroke-width="1.3"/>
<text x="328" y="580" class="hm" text-anchor="start">.env</text>
<text x="328" y="600" class="m" text-anchor="start">GITHUB_TOKEN, _2, _3</text>
<text x="328" y="618" class="m" text-anchor="start">CLAUDE_CODE_OAUTH_TOKEN</text>
<rect class="card-shadow" x="948" y="374" width="284" height="104" rx="9"/>
