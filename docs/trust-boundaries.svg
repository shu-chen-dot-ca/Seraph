<rect class="bg" x="0.5" y="0.5" width="1279" height="743" rx="14"/>
<text x="24" y="42" class="title" text-anchor="start">What stays where</text>
<text x="24" y="66" class="sub" text-anchor="start">Secrets stay where they are needed, and every line that could leak one or post to GitHub is cut.</text>
