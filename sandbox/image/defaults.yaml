# The defaults: what every image gets under its own image.yaml, unless that says defaults: false.
# The same keys as image.yaml, without system and desktop. packages is one list, or split into apt: (Ubuntu,
# Debian) and dnf: (Fedora) where the names differ. Default steps run before the image's own; an image step with
# the same name takes a default step's place. Images get a change here at their next Rebuild.

packages:
  apt: [git, git-lfs, build-essential, pkg-config, gh, ripgrep, jq, htop, unzip, sqlite3, postgresql-client]
  dnf: [git, git-lfs, gcc, gcc-c++, make, pkgconf-pkg-config, gh, ripgrep, jq, htop, unzip, sqlite, postgresql]

python:
  packages: []

node:
  packages: [pnpm, yarn]

docker:
  images: []

steps:
  - name: VS Code
    run: |
      # Microsoft's own repository. Only with a desktop.
      if [[ $SANDBOX_DESKTOP == none ]]; then
        exit 0
      fi
      if [[ $SANDBOX_FAMILY == apt ]]; then
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list
        apt-get -y update
        apt-get -y install code
      fi
      if [[ $SANDBOX_FAMILY == dnf ]]; then
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
        printf '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\n' > /etc/yum.repos.d/vscode.repo
        dnf -y install code
      fi

  - name: Playwright with Chromium
    run: |
      # In SANDBOX_VM_PLAYWRIGHT_DIR, its browser in browsers/ there (PLAYWRIGHT_BROWSERS_PATH in /etc/environment).
      # Playwright installs the browser's libraries itself on Ubuntu and Debian only.
      mkdir -p "$SANDBOX_VM_PLAYWRIGHT_DIR"
      cd "$SANDBOX_VM_PLAYWRIGHT_DIR"
      npm init -y > /dev/null
      npm install --no-audit --no-fund playwright@1
      with_deps=""
      if [[ $SANDBOX_FAMILY == apt ]]; then
        with_deps="--with-deps"
      fi
      PLAYWRIGHT_BROWSERS_PATH="$SANDBOX_VM_PLAYWRIGHT_DIR/browsers" npx playwright install $with_deps --only-shell chromium
      chmod -R a+rX "$SANDBOX_VM_PLAYWRIGHT_DIR"
